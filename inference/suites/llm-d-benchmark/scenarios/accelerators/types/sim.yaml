scenario:
  - name: sim
    affinity:
      enabled: true
      nodeSelector:
        kubernetes.io/os: linux
    accelerator:
      count: 0
      memory: 24
    model:
      maxModelLen: 1024
      gpuMemoryUtilization: 0
    decode:
      replicas: 3
      parallelism:
        tensor: 0
        data: 1
        dataLocal: 1
        workers: 1
      resources:
        limits: {memory: 100Mi, cpu: "0"}
        requests: {memory: 100Mi, cpu: "0"}
      accelerator:
        count: 0
    # Without this, the router/EPP pod falls back to the llm-d-router chart's
    # own default (cpu: 8, memory: 8Gi), which is sized for a real GPU node
    # and won't schedule on a laptop-sized cluster.
    router:
      epp:
        resources:
          limits: {memory: 512Mi, cpu: "1"}
          requests: {memory: 128Mi, cpu: "100m"}
