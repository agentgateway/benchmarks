name: AI gateway tooling
on:
  pull_request:
    paths: ['ai-gateway/**', '.github/workflows/ai-gateway-tooling.yaml']
  push:
    branches: [main]
    paths: ['ai-gateway/**', '.github/workflows/ai-gateway-tooling.yaml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate harness
        run: |
          bash -n ai-gateway/build-mock.sh
          shellcheck ai-gateway/build-mock.sh
          python3 -m unittest discover -s ai-gateway -p 'test_*.py'
          python3 ai-gateway/campaign.py --initial --dry-run > /tmp/ai-plan.json
          GOTOOLCHAIN=go1.27.1 CGO_ENABLED=0 go build -trimpath -o /tmp/mock-server ai-gateway/mock/main.go
