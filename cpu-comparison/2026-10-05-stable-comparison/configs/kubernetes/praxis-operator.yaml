apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-operator
  namespace: praxis-system
  labels:
    app.kubernetes.io/name: praxis-operator
    app.kubernetes.io/managed-by: praxis-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis-operator
    spec:
      serviceAccountName: praxis-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: praxis-operator:fb8beaa
        imagePullPolicy: IfNotPresent
        env:
        - name: PRAXIS_IMAGE
          value: ghcr.io/praxis-proxy/praxis@sha256:ef01934b86c6368e097fa8adfc879663a0f8b01cdd265802ba9595c3402230f8
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: observability
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: observability
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: observability
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      nodeSelector:
        benchmark-role: kcontroller
      tolerations:
      - key: benchmark-role
        operator: Equal
        value: kcontroller
        effect: NoSchedule
